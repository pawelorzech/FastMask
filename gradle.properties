org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# The Gradle daemon needs a JDK between 17 and 21 — Gradle 8.9 refuses to run on
# anything newer, and the Android/Kotlin toolchains here target 17.
#
# This file used to pin `org.gradle.java.home` to an absolute Homebrew path from
# one contributor's laptop. It is a public repository: on any other machine, and
# in CI, that path does not exist and the build fails before it reads a line of
# Kotlin. Machine-specific configuration belongs in ~/.gradle/gradle.properties
# (which is already where this project's signing keys and Play licence key live)
# or in JAVA_HOME:
#
#   org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
#
# Android Studio supplies its own JBR and needs neither.
