[versions]
agp = "9.5.0"
kotlin = "2.2.20"
ksp = "2.3.13"
hilt = "2.60.1"
googleServices = "4.5.0"
crashlytics = "3.0.2"

coreKtx = "1.12.0"
coreSplashscreen = "1.0.1"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
appcompat = "1.7.1"
# BOM 2026.09.00 = Compose 1.12.1 stable. material3 is pinned above the BOM
# (which still maps to 1.4.0) because the Expressive components the UI is built
# on (ButtonGroup, LoadingIndicator, MaterialShapes, FAB menu) are only public
# from 1.5.0. Beta = API-frozen; move to 1.5.0 stable when it lands.
composeBom = "2026.09.00"
material3 = "1.5.0-beta02"
graphicsShapes = "1.0.1"
adaptive = "1.0.0"
navigationCompose = "2.9.8"
hiltNavigationCompose = "1.4.0"
retrofit = "3.0.0"
okhttp = "5.5.1"
kotlinxSerialization = "1.6.2"
retrofitKotlinxSerializationConverter = "1.0.0"
# 8.x satisfies Play's "Billing Library 8+" requirement (Aug 31, 2026).
billing = "8.3.0"
biometric = "1.1.0"
playAppUpdate = "2.1.0"
securityCrypto = "1.1.0"
datastore = "1.2.1"
firebaseBom = "34.18.0"
coroutines = "1.11.0"

junit = "4.13.2"
mockk = "1.13.9"
# AndroidX Test 1.6.x / Espresso 3.6.x: the 3.5.1 line calls
# InputManager.getInstance(), removed in Android 16 (API 36), so every
# instrumented test died in Espresso.onIdle before reaching an assertion.
androidxTestExtJunit = "1.3.0"
androidxTest = "1.7.0"
espresso = "3.7.0"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive", version.ref = "adaptive" }
androidx-graphics-shapes = { module = "androidx.graphics:graphics-shapes", version.ref = "graphicsShapes" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
retrofit-kotlinx-serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitKotlinxSerializationConverter" }

# Base (Java) artifact, NOT billing-ktx: its extensions only wrap listeners we
# replace with our own suspend wrappers anyway.
play-billing = { module = "com.android.billingclient:billing", version.ref = "billing" }
# Base (Java) artifact rather than `app-update-ktx`: AppUpdateController
# hand-rolls its one suspending call, same as the Billing seam.
play-app-update = { module = "com.google.android.play:app-update", version.ref = "playAppUpdate" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }

# The BOM pins the SDK versions as a matched set. Firebase stopped releasing
# separate KTX artifacts in July 2025; the Crashlytics API lives in the main module.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }

junit = { module = "junit:junit", version.ref = "junit" }
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTest" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTest" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "crashlytics" }
